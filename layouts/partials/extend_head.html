{{- /* NCR — head extensions */ -}}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.Title }},
  "url": {{ site.Home.Permalink }},
  "description": {{ site.Params.description | plainify | truncate 155 | safeHTML }},
  "publisher": {
    "@type": "Organization",
    "name": {{ site.Title }},
    "url": {{ site.Home.Permalink }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ site.Params.assets.favicon | default "favicon.ico" | absURL }}
    }
  }
}
</script>

<style>
nav a[href*="ai-tool-advisor"] {
  position: relative;
  color: #7c3aed !important;
  font-weight: 600;
}
nav a[href*="ai-tool-advisor"]::before {
  content: '';
  position: absolute;
  top: -4px;
  left: -6px;
  right: -6px;
  bottom: -4px;
  background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.3), transparent);
  border-radius: 6px;
  animation: shimmer 2.5s ease-in-out infinite;
  z-index: -1;
}
@keyframes shimmer {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}
</style>
