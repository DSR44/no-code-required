<!-- NCR Email Subscription Form -->
<div style="background: linear-gradient(135deg, #131316 0%, #1a1a1d 100%); border-radius: 12px; padding: 32px; margin: 40px 0; text-align: center; border: 1px solid #2a2a2d;">
    <h3 style="color: #e8e6e1; font-size: 20px; margin-bottom: 8px; font-weight: 600;">Get new posts in your inbox</h3>
    <p style="color: #8a8880; font-size: 14px; margin-bottom: 24px;">No spam. No sales pitches. Just honest tool reviews.</p>
    
    <form id="subscribe-form" style="display: flex; gap: 12px; max-width: 400px; margin: 0 auto; flex-wrap: wrap; justify-content: center;">
        <input type="email" id="email" name="email" placeholder="your@email.com" required
               style="flex: 1; min-width: 200px; padding: 12px 16px; border: 1px solid #333; border-radius: 8px; background: #0a0a0b; color: #e8e6e1; font-size: 16px; outline: none; transition: border-color 0.2s;">
        <button type="submit" id="subscribe-btn"
                style="background: #e8a87c; color: #0a0a0b; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; transition: background 0.2s;">
            Subscribe
        </button>
    </form>
    
    <p id="subscribe-message" style="margin-top: 16px; font-size: 14px; display: none;"></p>
    <p style="color: #555; font-size: 11px; margin-top: 16px; line-height: 1.4;">By subscribing, you agree to receive email updates. Unsubscribe anytime. <a href="/privacy/" style="color: #8a8880;">Privacy</a></p>
</div>

<style>
#email:focus { border-color: #e8a87c !important; }
#subscribe-btn:hover { background: #d4956a !important; }
@media (max-width: 480px) {
    #subscribe-form { flex-direction: column; }
    #subscribe-form input, #subscribe-form button { width: 100%; }
}
</style>

<script>
document.getElementById('subscribe-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const msg = document.getElementById('subscribe-message');
    const btn = document.getElementById('subscribe-btn');
    
    btn.disabled = true;
    btn.textContent = 'Subscribing...';
    
    try {
        const response = await fetch('https://api.resend.com/contacts', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': 'Bearer re_LB9DJvVf_QFq2zGLsDz6xQ6v8rBqEhvnQ'
            },
            body: JSON.stringify({ 
                email: email,
                audience_id: 'nocoderequired',
                unsubscribed: false
            })
        });
        
        const data = await response.json();
        
        if (data.id || response.ok) {
            msg.textContent = '✓ Check your inbox to confirm!';
            msg.style.color = '#6bc4c4';
            msg.style.display = 'block';
            this.reset();
        } else {
            msg.textContent = 'Something went wrong. Try again.';
            msg.style.color = '#f87171';
            msg.style.display = 'block';
        }
    } catch (err) {
        msg.textContent = 'Something went wrong. Try again.';
        msg.style.color = '#f87171';
        msg.style.display = 'block';
    }
    
    btn.disabled = false;
    btn.textContent = 'Subscribe';
});
</script>
