baseURL = "https://www.nocoderequired.net"
languageCode = "en-us"
title = "NCR — No Code Required"
theme = "PaperMod"
canonifyURLs = true

[params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  description = "Learn AI and no-code tools without the jargon. Honest tutorials, tool reviews, and step-by-step guides for non-technical people."
  homeTitle = "No Code Required — AI & No-Code Tool Guides for Beginners"
  hreflang = "en"
  author = "NCR"
  env = "production"
  images = ["/images/og-default.jpg"]

[params.ogImage]
  width = 1200
  height = 630

[params.schema]
  publisherType = "Organization"
  sameAs = ["https://www.youtube.com/@manalbuilds", "https://www.nocoderequired.net/"]

[params.assets]
  favicon = "/favicon.ico"

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

[params.label]
  text = "NCR"
  icon = ""
  iconHeight = 35

[params.homeInfoParams]
  Title = "You don't need to code.\nYou need to learn how machines think."
  Content = "Real tools. Tested workflows. No jargon.<br>From someone who was scared of the terminal too."

[params.latestPosts]
  enabled = true
  count = 5

[[params.socialIcons]]
  name = "youtube"
  url = "https://www.youtube.com/@manalbuilds"

